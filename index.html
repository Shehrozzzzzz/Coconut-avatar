<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Coconut Avatar</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0fdf4; padding: 50px; }
    video { width: 350px; border-radius: 15px; border: 4px solid #16a34a; background: #000; }
    input { padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 10px 20px; background: #16a34a; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🥥 Talk to the Coconut Tree!</h1>
  <video id="avatarVideo" autoplay controls></video>
  <br><br>
  <input type="text" id="questionInput" placeholder="Ask me anything about coconuts...">
  <button onclick="askAvatar()">Ask</button>
  <p id="responseText"></p>

  <script>
    async function askAvatar() {
      const question = document.getElementById('questionInput').value;
      const statusText = document.getElementById('responseText');
      const videoPlayer = document.getElementById('avatarVideo');
      
      statusText.innerText = "The Coconut Tree is processing your answer and warming up its voice...";

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        
        const data = await res.json();
        
        if (data.error) {
          statusText.innerText = "Error: " + data.error;
          return;
        }

        // Output text answer and trigger video containing lip-sync audio
        statusText.innerText = `Coconut Tree: "${data.text}"`;
        videoPlayer.src = data.videoUrl;
        videoPlayer.load();
        videoPlayer.play();
      } catch (err) {
        statusText.innerText = "Failed to connect to backend service.";
      }
    }
  </script>
</body>
</html>
